name: Deploy website to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_BASE: ${{ vars.SITE_BASE || '/' }}
      DEMO_URL: ${{ vars.DEMO_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require a real public origin
        run: test -n "$SITE_URL"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: python3 tests/check-links.py dist "$SITE_BASE"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static artifact
        id: deployment
        uses: actions/deploy-pages@v4
